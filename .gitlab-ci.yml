# Pipelines run for merge requests, and for pushes to a branch with no open MR
# (so main, and recipe edits pushed straight to it). No duplicate branch + MR
# pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - build
  - verify

# Every job runs on recipes' own in-cluster runner (smart-home
# kubernetes/recipes-runner, Kubernetes executor on deskf02).
default:
  tags:
    - self-hosted

# Guard the README table of contents: every recipe linked, no dead links.
check_toc:
  stage: check
  image: alpine:latest
  before_script:
    - apk add --no-cache git grep sed coreutils findutils
  script:
    - sh scripts/check-toc.sh

# Markdown formatting, check only. Same pinned mdformat as the owner's global
# pre-commit hook, so commits made off his Mac (or in the web editor) are
# checked too. Config: .pre-commit-config.yaml.
check_format:
  stage: check
  image: python:3.14-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install -q pre-commit==4.3.0
  script:
    - pre-commit run --hook-stage manual --all-files --show-diff-on-failure

# Secret scanning over the full history (the repo is small).
check_secrets:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.30.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git --redact --verbose .

# --- The site (site/) --------------------------------------------------------
# Tests run on every pipeline, because they parse every recipe: a recipe edit
# that breaks the parser fails here, before it ships.
site_test:
  stage: check
  image: python:3.15-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
  before_script:
    - cd site
    - pip install -q uv
    - uv export --frozen --no-emit-project --extra dev --no-hashes -o /tmp/requirements-dev.txt
    - uv pip install --system -q -r /tmp/requirements-dev.txt
    - uv pip install --system -q --no-deps -e .
  script:
    - ruff check .
    - ruff format --check .
    - mypy src tests
    - pytest -q

# Rootless BuildKit, as in the fleet apps: no privileged pod, no Docker daemon.
# The layer cache lives in the registry, so a recipe-only change rebuilds only
# the last layers.
.buildkit_build:
  stage: build
  image:
    name: moby/buildkit:v0.34.0-rootless
    # The default entrypoint starts a long-running daemon; blank it so the job
    # runs buildctl-daemonless.sh, which starts and stops one per build.
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    BUILDKIT_CACHE_ARGS: >-
      --import-cache type=registry,ref=${CI_REGISTRY_IMAGE}/buildcache:main
      --export-cache type=registry,ref=${CI_REGISTRY_IMAGE}/buildcache:main,mode=max
  before_script:
    - mkdir -p ~/.docker
    - >
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "${CI_REGISTRY}"
      "$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
      > ~/.docker/config.json

# Every push to main builds and pushes an immutable, sortable tag
# (main-<pipeline iid>-<sha>). Flux image automation deploys the newest one to
# recipes-dev; prod waits for the promote job below.
site_build:
  extends: .buildkit_build
  needs: [site_test, check_toc]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  script:
    - VERSION=$(grep -m1 '^## v' site/CHANGELOG.md | sed -E 's/^## v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
    - '[ -n "$VERSION" ] || { echo "no version header in site/CHANGELOG.md"; exit 1; }'
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="${CI_PROJECT_DIR}"
      --local dockerfile="${CI_PROJECT_DIR}/site"
      ${BUILDKIT_CACHE_ARGS}
      --opt build-arg:ASSET_VERSION=${CI_COMMIT_SHORT_SHA}
      --opt build-arg:APP_VERSION=${VERSION}
      --output type=image,\"name=${CI_REGISTRY_IMAGE}/api:main-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA},${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}\",push=true

# On an MR that touches the build itself, prove the image still builds (no push).
site_build_mr:
  extends: .buildkit_build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - site/Dockerfile
        - site/pyproject.toml
        - site/uv.lock
        - site/package.json
        - site/package-lock.json
        - .dockerignore
        - .gitlab-ci.yml
  script:
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="${CI_PROJECT_DIR}"
      --local dockerfile="${CI_PROJECT_DIR}/site"
      ${BUILDKIT_CACHE_ARGS}
      --opt build-arg:ASSET_VERSION=${CI_COMMIT_SHORT_SHA}

# Poll HEALTH_URL until it reports this commit, or a newer build that contains
# it (Flux deploys only the newest tag, so a later commit can win the race).
.wait_for_build:
  stage: verify
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  timeout: 20m
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache curl jq git >/dev/null
    # Retry from the very first request: kube-router refuses a brand-new pod's
    # connections for about a second.
    - |
      for i in $(seq 1 90); do
        build=$(curl -fsS "$HEALTH_URL" | jq -r .build || true)
        echo "attempt $i: build ${build:-none}, want ${CI_COMMIT_SHORT_SHA} or newer"
        [ "$build" = "$CI_COMMIT_SHORT_SHA" ] && exit 0
        if [ -n "$build" ] && [ "$build" != "dev" ]; then
          git fetch -q origin "$CI_DEFAULT_BRANCH" || true
          if git merge-base --is-ancestor "$CI_COMMIT_SHA" "$build" 2>/dev/null; then
            echo "a newer build that includes this commit is serving"
            exit 0
          fi
        fi
        sleep 10
      done
      echo "$HEALTH_URL never reported ${CI_COMMIT_SHORT_SHA}"
      exit 1

# Dev is the pre-prod gate: the build has to come up there, migrations
# included, before prod gets it. Only this project's runner pods can reach it
# (smart-home kubernetes/components/ci-verify-dev).
verify_dev:
  extends: .wait_for_build
  needs: [site_build]
  variables:
    HEALTH_URL: http://recipes-dev-app.recipes-dev.svc.cluster.local:8000/health

# Tag the verified image prod-<iid>-<sha>. The prod ImagePolicy in smart-home
# follows prod- tags, so this tag is the deploy. It's a registry operation: CI
# never touches the cluster.
promote:
  stage: verify
  image: alpine:latest
  needs: [verify_dev]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    CRANE_VERSION: v0.20.3
  script:
    - wget -qO- "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crane
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane tag "${CI_REGISTRY_IMAGE}/api:main-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}" "prod-${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"

# A green pipeline means serving in prod, not just built: wait until the public
# /health reports this commit.
verify_live:
  extends: .wait_for_build
  needs: [promote]
  variables:
    HEALTH_URL: https://recipes.skalchemy.com/health

# Mirror main to github.com/cgoettel/recipes on every push to main.
# GITHUB_DEPLOY_KEY is a File-type CI variable holding the SSH private key
# whose public half is a write-enabled deploy key on the GitHub repo.
mirror_to_github:
  stage: check
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # glab strips trailing newline from variable values — re-add it
    - cp "$GITHUB_DEPLOY_KEY" ~/.ssh/id_ed25519
    - printf '\n' >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - git remote add github git@github.com:cgoettel/recipes.git
    - git push --force github HEAD:refs/heads/main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
